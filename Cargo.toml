[package]
name = "dev-cli"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Rust implementation of the dev remote development CLI"
publish = false

[[bin]]
name = "dev"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
chrono = { version = "0.4.42", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6.6", features = ["derive"] }
regex = "1.12.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
tempfile = "3.25.0"
wait-timeout = "0.2.1"

[dev-dependencies]
assert_cmd = "2.2.2"
assert_fs = "1.1.3"
predicates = "3.1.4"
