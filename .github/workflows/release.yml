name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - run: test "v$(sed -n 's/^version = \"\(.*\)\"/\1/p' Cargo.toml)" = "$GITHUB_REF_NAME"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-targets --all-features
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            rustflags: -C target-feature=+crt-static
          - target: x86_64-apple-darwin
            runner: macos-14
          - target: aarch64-apple-darwin
            runner: macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target ${{ matrix.target }}
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          file target/${{ matrix.target }}/release/dev
          ldd target/${{ matrix.target }}/release/dev 2>&1 | grep -Eq 'not a dynamic executable|statically linked'
      - run: tar -C target/${{ matrix.target }}/release -czf dev-${{ matrix.target }}.tar.gz dev
      - run: shasum -a 256 dev-${{ matrix.target }}.tar.gz > dev-${{ matrix.target }}.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: dev-${{ matrix.target }}
          path: |
            dev-${{ matrix.target }}.tar.gz
            dev-${{ matrix.target }}.tar.gz.sha256
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: cat artifacts/*.sha256 > artifacts/SHA256SUMS
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: artifacts/*
